name: CI / CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test_and_verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_SUPABASE_URL: "https://demo-project.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiJ9.mock_signature"
      CI: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit & Regression Tests
        run: npm run test:unit
